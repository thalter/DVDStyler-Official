name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check-version:
    name: Check tag matches configure.ac
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          VERSION=$(sed -n 's/^AC_INIT(\[DVDStyler\],\[\([^]]*\)\].*/\1/p' configure.ac)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match AC_INIT version $VERSION in configure.ac"
            exit 1
          fi

  build:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{source-tarball,macos-dmg}'
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Alpha/beta/rc versions (e.g. v3.3b4) are published as pre-releases.
          PRERELEASE=
          if echo "$GITHUB_REF_NAME" | grep -Eq '(a|b|rc)[0-9]*$'; then
            PRERELEASE=--prerelease
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "DVDStyler ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag $PRERELEASE
